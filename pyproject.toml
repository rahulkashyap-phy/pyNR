[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pynr"
dynamic = ["version"]
description = "A teaching-oriented numerical relativity code in Python, structured like the Einstein Toolkit and accelerated with Numba."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Rahul Kashyap", email = "rahulkashyap@iitb.ac.in" }]
maintainers = [{ name = "Rahul Kashyap", email = "rahulkashyap@iitb.ac.in" }]
keywords = ["numerical relativity", "general relativity", "gravitational waves", "einstein toolkit", "numba"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
viz = ["kuibit>=1.5", "matplotlib>=3.7"]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "kuibit>=1.5", "matplotlib>=3.7"]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
]
test = ["pytest>=7", "sympy>=1.12"]
dev = ["pynr[viz,notebook,docs,test]", "ruff>=0.5"]

[project.scripts]
pynr = "pynr.__main__:main"

[project.urls]
Homepage = "https://github.com/rahulkashyap-phy/pyNR"
Documentation = "https://rahulkashyap-phy.github.io/pyNR"
Source = "https://github.com/rahulkashyap-phy/pyNR"

[tool.hatch.version]
path = "pynr/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["pynr", "par", "tests", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running evolution tests"]

[tool.ruff]
line-length = 100
