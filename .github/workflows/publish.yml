# Build sdist + wheel and publish with PyPI "trusted publishing" (no API token).
# One-time setup on pypi.org -> "Publishing" -> add a trusted publisher:
#   owner: rahulkashyap-phy, repo: pyNR, workflow: publish.yml, environment: pypi
# (and the same on test.pypi.org with environment: testpypi).
# Release: bump __version__ in pynr/__init__.py, tag vX.Y.Z, publish a GitHub release.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:   # manual run -> TestPyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
