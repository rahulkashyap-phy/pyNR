name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz, TeX Live and the docs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra fonts-freefont-otf
          pip install -e ".[docs]"
      - name: Architecture drift check
        run: python arch/check_drift.py --branch "${{ github.ref_name }}"
      - name: Generate parameter reference
        run: |
          {
            printf '# Thorn parameters\n\nGenerated by `pynr thorns --markdown`.\n\n'
            pynr thorns --markdown
          } > docs/reference/parameters.md
      - name: Build PDF lecture notes (LaTeX) and the HTML site that serves them
        run: make -C docs all
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-notes-pdf
          path: docs/_build/latex/pyNR-lecture-notes.pdf
          retention-days: 30
      # Always available: Actions -> this run -> Artifacts -> docs-html (zip; open index.html)
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: docs/_build/html

  # GitHub Pages: only once the repository is public (Settings -> Pages -> Source: GitHub Actions)
  deploy:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
