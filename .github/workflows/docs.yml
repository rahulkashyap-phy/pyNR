name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # HTML only. The PDF lecture notes are built locally (make -C docs all); CI does not install TeX Live.
      - name: Install Graphviz and the docs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          pip install -e ".[docs]"
      - name: Architecture drift check
        run: python arch/check_drift.py --branch "${{ github.ref_name }}"
      - name: Generate parameter reference
        run: |
          {
            printf '# Thorn parameters\n\nGenerated by `pynr thorns --markdown`.\n\n'
            pynr thorns --markdown
          } > docs/reference/parameters.md
      - name: Build the HTML site
        run: make -C docs html
      # Always available: Actions -> this run -> Artifacts -> docs-html (zip; open index.html)
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: docs/_build/html

  # GitHub Pages: only once the repository is public. One-time setup by the repository owner:
  #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
  # Without it this job fails with "Not Found" (the Pages site does not exist).
  deploy:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
