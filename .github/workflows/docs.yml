name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[docs]"
      - name: Generate parameter reference
        run: |
          {
            printf '# Thorn parameters\n\nGenerated by `pynr thorns --markdown`.\n\n'
            pynr thorns --markdown
          } > docs/reference/parameters.md
      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html
      # Always available: Actions -> this run -> Artifacts -> docs-html (zip; open index.html)
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: docs/_build/html

  # GitHub Pages: only once the repository is public (Settings -> Pages -> Source: GitHub Actions)
  deploy:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
